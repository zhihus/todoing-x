name: Release build

# Manual dispatch uploads workflow artifacts only; a v* tag creates/refreshes a draft release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match Cargo.toml)"
        required: true
      notes:
        description: "Brief changelog for the release manifest"
        required: false
        default: "Release build."
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version against Cargo.toml
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            EXPECTED="$INPUT_VERSION"
            SOURCE="workflow_dispatch input"
          else
            EXPECTED="${GITHUB_REF#refs/tags/v}"
            SOURCE="tag"
          fi
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Expected version ($SOURCE): $EXPECTED"
          if [ "$CARGO_VERSION" != "$EXPECTED" ]; then
            echo "FAIL: version mismatch — $SOURCE does not match Cargo.toml"
            exit 1
          fi
          echo "Version OK: $CARGO_VERSION"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Sanity checks
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Build release artifacts (bash)
        if: runner.os != 'Windows'
        env:
          RELEASE_NOTES: ${{ github.event.inputs.notes }}
        run: |
          NOTES="${RELEASE_NOTES:-Release build.}"
          chmod +x release/*.sh
          bash release/build.sh --notes "$NOTES"

      - name: Build release artifacts (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ github.event.inputs.notes }}
        run: |
          $notes = $env:RELEASE_NOTES
          if ([string]::IsNullOrEmpty($notes)) { $notes = "Release build." }
          ./release/build.ps1 -Notes $notes

      - name: Upload artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: release/dist/

  publish-draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create/refresh DRAFT release (never published)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          for d in artifacts/release-*/release/dist/*/*/; do
            [ -d "$d" ] || continue
            while IFS= read -r -d '' f; do
              gh release view "$TAG" >/dev/null 2>&1 || \
                gh release create "$TAG" --draft --title "Todoing ${TAG#v}" --notes "Draft release. Review before publishing."
              gh release upload "$TAG" "$f" --clobber
            done < <(find "$d" -maxdepth 1 -type f -print0)
          done
          echo "Draft release '$TAG' refreshed. Publish it manually after review."
