name: Release build

# Builds release artifacts on each supported platform's native runner.
#
# Triggers and behavior:
#   - workflow_dispatch (manual): validates the `version` input against
#     Cargo.toml, builds artifacts on every platform, and uploads them as
#     workflow artifacts only. It does NOT create a tag and does NOT create
#     a GitHub Release.
#   - push of a v* tag: validates the tag against Cargo.toml, builds
#     artifacts on every platform, and creates/refreshes a DRAFT GitHub
#     Release for that tag. It never publishes the draft.
#
# It never creates or pushes tags, never publishes a release, and never
# pushes commits. Publishing a draft is a separate, manual, explicitly-
# approved step (see release/RELEASE.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match Cargo.toml)"
        required: true
      notes:
        description: "Brief changelog for the release manifest"
        required: false
        default: "Release build."
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Fail fast if the requested version (workflow_dispatch input, or the tag
  # name on a tag push) does not match the version in Cargo.toml. This makes
  # the `version` input explicit and prevents it from being silently ignored.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version against Cargo.toml
        run: |
          set -euo pipefail
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED="${{ github.event.inputs.version }}"
            SOURCE="workflow_dispatch input"
          else
            EXPECTED="${GITHUB_REF#refs/tags/v}"
            SOURCE="tag"
          fi
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Expected version ($SOURCE): $EXPECTED"
          if [ "$CARGO_VERSION" != "$EXPECTED" ]; then
            echo "FAIL: version mismatch — $SOURCE says '$EXPECTED' but Cargo.toml says '$CARGO_VERSION'"
            exit 1
          fi
          echo "Version OK: $CARGO_VERSION"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Sanity checks
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Build release artifacts (bash)
        if: runner.os != 'Windows'
        run: |
          chmod +x release/*.sh
          bash release/build.sh --notes "${{ github.event.inputs.notes || 'Release build.' }}"

      - name: Build release artifacts (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./release/build.ps1 -Notes "${{ github.event.inputs.notes || 'Release build.' }}"

      - name: Upload artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: release/dist/

  # Aggregate the per-platform artifacts into a single draft release.
  # Runs only when a tag is present (so a version/tag exists to attach to).
  publish-draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create/refresh DRAFT release (never published)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          # Collect every dist/<version>/<platform-arch> directory.
          for d in artifacts/release-*/release/dist/*/*/; do
            [ -d "$d" ] || continue
            while IFS= read -r -d '' f; do
              gh release view "$TAG" >/dev/null 2>&1 || \
                gh release create "$TAG" --draft --title "Todoing ${TAG#v}" --notes "Draft release. Review before publishing."
              gh release upload "$TAG" "$f" --clobber
            done < <(find "$d" -maxdepth 1 -type f -print0)
          done
          echo "Draft release '$TAG' refreshed. Publish it manually after review."