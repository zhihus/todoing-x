name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting for SQLite storage additions
        run: rustfmt --edition 2024 --check src/sqlite_store.rs tests/sqlite_store.rs
      - run: cargo test
      - name: Upload resolved Cargo.lock
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: todoing-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
      - run: cargo build --release
      - name: Install binary into isolated directory
        run: cargo install --path . --root target/install-check
      - name: Smoke-test installed binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            target/install-check/bin/todoing.exe --help
            target/install-check/bin/todoing.exe version
          else
            target/install-check/bin/todoing --help
            target/install-check/bin/todoing version
          fi
