name: Rust CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Install binary into isolated directory
        run: cargo install --path . --root target/install-check
      - name: Smoke-test installed binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            target/install-check/bin/todoing.exe --help
            target/install-check/bin/todoing.exe version
          else
            target/install-check/bin/todoing --help
            target/install-check/bin/todoing version
          fi

  sqlite-lock-spike:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test SQLite locking spike
        run: cargo test --manifest-path spikes/sqlite-locking/Cargo.toml

  openspec-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.16.0
      - name: Validate OpenSpec changes and specs
        run: openspec validate --all
      - name: Install JSON Schema validator
        run: npm install --global ajv-cli@5.0.0
      - name: Validate JSON API schemas
        run: |
          ajv compile --spec=draft2020 -s docs/api/v1/request.schema.json
          ajv compile --spec=draft2020 -s docs/api/v1/response.schema.json
