name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting for SQLite storage additions
        run: rustfmt --edition 2024 --check src/sqlite_store.rs tests/sqlite_store.rs
      - run: cargo test
      - name: Commit resolved Cargo.lock
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build: update Cargo.lock"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - run: cargo build --release --locked
      - name: Install binary into isolated directory
        run: cargo install --path . --root target/install-check --locked
      - name: Smoke-test installed binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            target/install-check/bin/todoing.exe --help
            target/install-check/bin/todoing.exe version
          else
            target/install-check/bin/todoing --help
            target/install-check/bin/todoing version
          fi
