name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Install binary into isolated directory
        run: cargo install --path . --root target/install-check
      - name: Smoke-test installed binary
        run: |
          target/install-check/bin/todoing --help
          target/install-check/bin/todoing version
