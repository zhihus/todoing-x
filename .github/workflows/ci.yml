name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Install binary into isolated directory
        run: cargo install --path . --root target/install-check
      - name: Smoke-test installed binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            target/install-check/bin/todoing.exe --help
            target/install-check/bin/todoing.exe version
          else
            target/install-check/bin/todoing --help
            target/install-check/bin/todoing version
          fi
