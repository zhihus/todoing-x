[package]
name = "todoing"
version = "1.1.0"
edition = "2024"
description = "Local, git-friendly task manager for AI agents and humans"
readme = "README.md"
repository = "https://github.com/zhihus/todoing-x"
license = "MIT"

[[bin]]
name = "todoing"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
